<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Checkout</title><link rel="stylesheet" href="style.css"></head><body><header class="header"><a class="logo" href="index.html">Palestinian Bridal</a><nav><a href="index.html">Home</a><a href="dresses.html">Dresses</a><span id="headerPageLinks" class="header-page-links"></span><a href="cart.html">Cart <span id="cartCount">0</span></a><a href="contact.html">Contact</a><a href="account.html">Account</a></nav></header><section class="page-head"><p class="small-title">Checkout</p><h1>Order Details</h1><p>Customer information, delivery charge, Zelle payment, and sizing.</p></section><section class="checkout-wrap"><form id="checkoutForm" class="checkout-form"><div class="box"><h2>Customer Information</h2><div class="form-grid"><label>Full Name *<input required name="fullName" type="text"></label><label>Main Phone Number *<input required name="phone1" type="tel"></label><label>Second Phone Number Optional<input name="phone2" type="tel"></label><label>Email Optional<input name="email" type="email"></label></div></div><div class="box"><h2>Shipping Address</h2><div class="form-grid"><label>Street Address *<input required id="addressInput" name="address" type="text" autocomplete="street-address" placeholder="Start typing address"></label><label>Apartment / Unit<input name="apartment" type="text" autocomplete="address-line2"></label><label>City *<input required id="cityInput" name="city" type="text" autocomplete="address-level2"></label><label>State *<input required id="stateInput" name="state" type="text" autocomplete="address-level1"></label><label>ZIP Code *<input required id="zipInput" name="zip" type="text" autocomplete="postal-code" oninput="updateCheckoutTotal()"></label></div></div><div class="box"><h2>Delivery</h2><div id="deliveryBox" class="delivery-result"></div></div><div class="box"><h2>Discount Code</h2><div class="discount-row"><label>Code<input id="discountCode" type="text" oninput="updateCheckoutTotal()" placeholder="Enter code"></label><button class="btn light-btn" type="button" onclick="updateCheckoutTotal()">Apply</button></div><p id="discountMessage" class="note"></p></div><div class="box"><h2>Payment</h2><div id="paymentOptions"></div></div><div class="box"><h2>Measurements</h2><label class="choice"><input type="radio" name="measurementMode" value="same" checked onchange="renderMeasurementChoice()"> <span><strong>Use the same measurements</strong><br>One size form for all dresses.</span></label><label class="choice"><input type="radio" name="measurementMode" value="different" onchange="renderMeasurementChoice()"> <span><strong>Use different measurements</strong><br>Each dress gets its own size form.</span></label><div id="measurementForms"></div></div><div class="preview-box" id="orderPreview"></div><button class="btn main-btn full" type="submit">Place Order</button></form><aside class="summary-box"><h2>Order Summary</h2><div id="checkoutSummary"></div></aside></section><footer><p>© 2026 <span class="logo">Palestinian Bridal</span></p></footer><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-init.js"></script>
<script src="script.js"></script><script>renderCheckout();</script></body></html>
