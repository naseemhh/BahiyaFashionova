<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Order</title><link rel="stylesheet" href="style.css"></head><body><header class="header"><a class="logo" href="index.html">Palestinian Bridal</a><nav><a href="index.html">Home</a><a href="dresses.html">Dresses</a><span id="headerPageLinks" class="header-page-links"></span><a href="account.html">Account</a><a href="cart.html">Cart <span id="cartCount">0</span></a><a href="contact.html">Contact</a></nav></header><section class="page-head"><p class="small-title">Order</p><h1>Order Preview & Tracking</h1><p>Review your order and tracking information.</p></section><section class="section top-small"><div id="customerOrderBox" class="box"></div></section><footer><p>© 2026 <span class="logo">Palestinian Bridal</span></p></footer><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="script.js"></script><script>applySite();updateCartCount();renderHeaderPageLinks();const id=new URLSearchParams(location.search).get("id");const o=getOrders().find(x=>x.id===id);document.getElementById("customerOrderBox").innerHTML=o?`<h2>${o.id}</h2><p><strong>Status:</strong> ${o.status}</p><p><strong>Total:</strong> ${money(o.total)}</p><div class="track-box"><strong>Tracking Number:</strong> ${o.trackingNumber||"Not added yet"}<br>${o.trackingLink?`<a class="btn light-btn" href="${o.trackingLink}" target="_blank">Track Package</a>`:""}</div><pre>${orderToText(o)}</pre>`:`<div class="empty"><h2>Order not found</h2></div>`;</script></body></html>
